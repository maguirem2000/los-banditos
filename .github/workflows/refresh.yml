name: Refresh league data

on:
  schedule:
    # Tuesday 11:00 UTC (~6-7am ET) — after Monday Night Football finalizes
    - cron: "0 11 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest data from Sleeper
        run: python3 fetch_league.py

      - name: Rebuild analytics
        run: |
          python3 build_data.py
          python3 build_extras.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "banditos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data.js assets/extras.js data/raw
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly data refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
